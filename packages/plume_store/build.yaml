targets:
  $default:
    builders:
      drift_dev:
        options:
          store_date_time_values_as_text: false
          sql:
            dialect: sqlite
            options:
              version: "3.46"
              modules:
                - fts5
                - json1
          databases:
            plume: lib/src/database.dart
          schema_dir: drift_schemas/
          test_dir: test/drift/
