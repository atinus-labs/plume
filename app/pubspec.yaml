name: plume
description: A fast, beautiful Material 3 Expressive mail client.
publish_to: none
version: 0.1.0+1
resolution: workspace

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  clock: ^1.1.3
  collection: ^1.19.1
  crypto: ^3.0.6
  file_selector: ^1.1.0
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  flutter_widget_from_html_core: ^0.17.4
  intl: ^0.20.3
  logging: ^1.3.0
  material_symbols_icons: ^4.2960.0
  path: ^1.9.1
  path_provider: ^2.1.6
  plume_core:
    path: ../packages/plume_core
  plume_design:
    path: ../packages/plume_design
  plume_gmail:
    path: ../packages/plume_gmail
  plume_imap:
    path: ../packages/plume_imap
  plume_linux:
    path: ../packages/plume_linux
  plume_mime:
    path: ../packages/plume_mime
  plume_store:
    path: ../packages/plume_store
  sqlite3_flutter_libs: ^0.6.0+eol
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_driver:
    sdk: flutter
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/branding/plume.png
